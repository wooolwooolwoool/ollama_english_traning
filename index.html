<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0" charset="utf-8">
<title>English Lesson</title>
<style>
body {
    font-family: sans-serif;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
}
.chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
}
.msg {
    margin: 8px 0;
    max-width: 80%;
    padding: 8px 10px;
    border-radius: 10px;
}
.user {
    text-align: right;
}
.ai {
    text-align: left;
    color: blue;
}
button {
    width: 100%;
    height: 50px;
    margin-top: 10px;
    font-size: 16px;
}
.icon-btn {
    width: 44px;
    height: 44px;
    font-size: 18px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: #eee;
}

.icon-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.input-area {
    display: flex;
    gap: 6px;
    padding: 8px;
    border-top: 1px solid #ccc;
    position: sticky;
    bottom: 0;
    background: white;
}
#textInput {
    flex: 1;
    height: 44px;
    font-size: 16px;
    padding: 0 10px;
}

.user {
    margin-left: auto;
    background: #DCF8C6;
}

.ai {
    margin-right: auto;
    background: #eee;
}
</style>
</head>
<body>

<h2>English Lesson</h2>

<div class="chat" id="chat"></div>

<div class="input-area">
  <input id="textInput" type="text"
    style="flex:1; height:36px; padding:0 8px;"
    placeholder="Answer in English..." />

  <button id="send" class="icon-btn">➤</button>
  <button id="rec" class="icon-btn">🎤</button>
</div>

<div class="input-area">
    <button id="retry">Retry</button>
    <button id="reset">Reset Lesson</button>
    <button id="back">↩</button>
</div>
<script>
let audioContext = null;
let processor;
let input;
let stream;
let audioData = [];

const chat = document.getElementById("chat");
const btn = document.getElementById("rec");
const sendBtn = document.getElementById("send");
const textInput = document.getElementById("textInput");
const backBtn = document.getElementById("back");

btn.onclick = async () => {
    if (!audioContext) {
        setLoading(true);

        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new AudioContext({ sampleRate: 16000 });

        input = audioContext.createMediaStreamSource(stream);
        processor = audioContext.createScriptProcessor(4096, 1, 1);

        input.connect(processor);
        processor.connect(audioContext.destination);

        audioData = [];

        processor.onaudioprocess = (e) => {
            const channel = e.inputBuffer.getChannelData(0);
            audioData.push(new Float32Array(channel));
        };

        btn.innerText = "■"; // 録音中アイコン
        btn.disabled = false;

    } else {
        processor.disconnect();
        input.disconnect();
        stream.getTracks().forEach(track => track.stop());

        const wavBlob = encodeWAV(audioData, 16000);
        audioContext = null;

        btn.innerText = "🎤";
        btn.disabled = true;
        await sendAudio(wavBlob);
        setLoading(false);
    }
};

const retryBtn = document.getElementById("retry");

retryBtn.onclick = () => {
    // 録音中なら停止
    if (audioContext) {
        processor.disconnect();
        input.disconnect();
        stream.getTracks().forEach(track => track.stop());
        audioContext = null;
    }

    audioData = [];
    btn.innerText = "🎤";
    setLoading(false);
};

backBtn.onclick = async () => {
    const res = await fetch("/api/back", { method: "POST" });
    const data = await res.json();

    if (data.status !== "ok") return;

    // チャットを1ターン分削除（5行分）
    for (let i = 0; i < 5; i++) {
        if (chat.lastChild) {
            chat.removeChild(chat.lastChild);
        }
    }

    // 質問を戻す
    addMessage("AI: " + data.question, "ai");
};

// --- WAVエンコード ---
function encodeWAV(samples, sampleRate) {
    let length = samples.reduce((acc, cur) => acc + cur.length, 0);
    let buffer = new ArrayBuffer(44 + length * 2);
    let view = new DataView(buffer);

    let offset = 0;

    function writeString(s) {
        for (let i = 0; i < s.length; i++) {
            view.setUint8(offset++, s.charCodeAt(i));
        }
    }

    writeString("RIFF");
    view.setUint32(offset, 36 + length * 2, true); offset += 4;
    writeString("WAVE");
    writeString("fmt ");
    view.setUint32(offset, 16, true); offset += 4;
    view.setUint16(offset, 1, true); offset += 2; // PCM
    view.setUint16(offset, 1, true); offset += 2; // mono
    view.setUint32(offset, sampleRate, true); offset += 4;
    view.setUint32(offset, sampleRate * 2, true); offset += 4;
    view.setUint16(offset, 2, true); offset += 2;
    view.setUint16(offset, 16, true); offset += 2;
    writeString("data");
    view.setUint32(offset, length * 2, true); offset += 4;

    let pos = 0;
    for (let s of samples) {
        for (let i = 0; i < s.length; i++, pos += 2) {
            let val = Math.max(-1, Math.min(1, s[i]));
            view.setInt16(44 + pos, val * 0x7fff, true);
        }
    }

    return new Blob([view], { type: "audio/wav" });
}

// --- API送信 ---
async function sendAudio(blob) {
    try {
        const form = new FormData();
        form.append("file", blob, "voice.wav");

        const res = await fetch("/api/voice", {
            method: "POST",
            body: form
        });

        const data = await res.json();

        addMessage("You: " + data.user, "user");
        addMessage("Correction: " + data.correction, "ai");
        addMessage("Explanation: " + data.explanation, "ai");
        addMessage("Next: " + data.next_question, "ai");
        if (data.audio_url != "") {
            playAudio(data.audio_url);
        }

    } finally {
        setLoading(false);
    }
}

// --- UI表示 ---
function addMessage(text, cls) {
    const div = document.createElement("div");
    div.className = "msg " + cls;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

// --- 音声再生 ---
function playAudio(url) {
    const audio = new Audio(url + "?t=" + Date.now());
    audio.play();
}

function setLoading(isLoading) {
    sendBtn.disabled = isLoading;
    btn.disabled = isLoading;
}

async function sendText() {
    const text = textInput.value.trim();
    if (!text) return;

    setLoading(true);

    try {
        const res = await fetch("/api/text", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ text })
        });

        const data = await res.json();

        addMessage("You: " + data.user, "user");
        addMessage("Correction: " + data.correction, "ai");
        addMessage("Explanation: " + data.explanation, "ai");
        addMessage("Next: " + data.next_question, "ai");

        playAudio(data.audio_url);
        textInput.value = "";

    } finally {
        setLoading(false);
    }
}

// 初期メッセージ
addMessage("AI: What topic should we talk about today?", "ai");

const resetBtn = document.getElementById("reset");

resetBtn.onclick = async () => {
    await fetch("/api/reset", { method: "POST" });

    // UIリセット
    chat.innerHTML = "";
    addMessage("AI: What topic should we talk about today?", "ai");
};

sendBtn.onclick = sendText;
textInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendText();
});

</script>

</body>
</html>
